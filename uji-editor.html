<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uji Editor - PYLearn</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <h1>Uji Editor</h1>
  <textarea id="kode">print("Halo, PYLearn!")</textarea> 

  <p>
    <button id="tombol-jalankan" class="tombol">Jalankan Kode</button>
    <button id="tombol-stop" class="tombol tombol-stop">Stop</button>
    <span id="status-python"></span>
  </p>

  <h2>Output</h2>
  <pre id="output" class="panel-output"></pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
  <script type="module" src="js/pages/uji-editor.js"></script>
</body>
</html>
